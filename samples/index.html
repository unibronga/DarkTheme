<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unibronga &mdash; тестовая страница</title>
    <link rel="stylesheet" href="./styles.css">

    <style>
        /* Встроенный CSS */
        :root { --accent: #ff7010; }
        .card > h2:hover { color: var(--accent); }
    </style>
</head>
<body class="page page--dark" data-theme='dark'>
    <!-- Шапка сайта -->
    <header id="top" class="header">
        <nav aria-label="Основное меню">
            <a href="#features" class="link link--active">Возможности</a>
            <a href='https://example.com?q=1&amp;lang=ru' target="_blank" rel="noopener">Ссылка</a>
        </nav>
    </header>

    <main>
        <section class="card" hidden>
            <h2>Заголовок &laquo;карточки&raquo;</h2>
            <p>Текст с <strong>жирным</strong>, <em>курсивом</em> и <code>кодом</code>.</p>
            <img src="img/logo.svg" alt="Логотип" width="120" height="40" loading="lazy">
        </section>

        <form action="/api/send" method="post" novalidate>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@mail.com" required>
            <select name="plan">
                <option value="free" selected>Free</option>
                <option value="pro">Pro</option>
            </select>
            <button type="submit" disabled>Отправить</button>
        </form>

        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M12 2L2 7l10 5 10-5-10-5z" stroke="currentColor" stroke-width="2"/>
        </svg>
    </main>

    <script type="module">
        // Встроенный JS
        import { initApp } from './app.js';

        const root = document.querySelector('#top');
        const count = 42;

        document.addEventListener('DOMContentLoaded', () => {
            initApp(root, { count, debug: true });
            console.log(`Ready: ${count} items`);
        });
    </script>
</body>
</html>
